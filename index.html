<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>寶可夢 · 退位減法棒棒圖</title>
<style>
  :root{
    --gold1:#ffd27a; --gold2:#eda22e;
    --blue1:#a9d8f7; --blue2:#6bb0e0;
    --ink:#2b3445; --muted:#7a8ba6;
    --accent:#e8462c;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{
    margin:0; padding:22px 14px 90px;
    font-family:"PingFang TC","Hiragino Sans TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(900px 520px at 8% -12%, #e6f2ff 0%, transparent 62%),
      radial-gradient(820px 480px at 102% -4%, #f2eaff 0%, transparent 58%),
      linear-gradient(180deg,#fbfdff,#f2f7fd);
    min-height:100vh;
  }
  .wrap{ max-width:1040px; margin:0 auto; }

  header{ text-align:center; margin-bottom:18px; }
  h1{
    margin:0; font-size:clamp(22px,4.4vw,32px); letter-spacing:1px;
    background:linear-gradient(90deg,#f0a13a,#e2653b 45%,#5b8dd6);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .sub{ margin:6px 0 0; color:var(--muted); font-size:14px; }

  .qcard{
    position:relative; background:#fff; border-radius:20px; padding:20px 22px 18px;
    box-shadow:0 10px 30px rgba(84,116,160,.13);
    border:1px solid #eaf1f9;
  }
  .qtag{
    position:absolute; top:-12px; left:20px; font-size:12px; letter-spacing:2px;
    background:linear-gradient(90deg,#ffc457,#ff9c3d); color:#fff;
    padding:4px 14px; border-radius:999px; box-shadow:0 4px 12px rgba(255,156,61,.4);
  }
  #qtext{ margin:4px 0 12px; font-size:clamp(16px,2.7vw,20px); line-height:1.75; font-weight:600; }
  .eqline{
    font-size:clamp(20px,3.6vw,26px); font-weight:800; letter-spacing:1px;
    font-family:ui-monospace,"SF Mono",Menlo,monospace;
    color:#5b8dd6;
  }
  .eqline .qm{ color:var(--accent); }

  .boards{ display:flex; flex-wrap:wrap; gap:18px; margin-top:20px; }
  .board{
    flex:1 1 320px; min-width:280px;
    background:#fff; border-radius:20px; padding:14px 16px 16px;
    border:2px solid #eaf1f9;
    box-shadow:0 8px 24px rgba(84,116,160,.10);
    transition:border-color .3s, box-shadow .3s, transform .3s;
  }
  .board.highlight{
    border-color:#ffc857;
    box-shadow:0 0 0 7px rgba(255,200,87,.22), 0 12px 32px rgba(84,116,160,.18);
    transform:translateY(-2px);
  }
  .board-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .who{ font-weight:800; font-size:17px; display:flex; align-items:center; }
  /* 精靈球圖示 */
  .who::before{
    content:''; display:inline-block; width:16px; height:16px; border-radius:50%;
    background:linear-gradient(180deg,#ee4035 0 46%, #2b3445 46% 54%, #fff 54% 100%);
    border:1.5px solid #2b3445; margin-right:7px; vertical-align:-2px;
  }
  .cnt{
    font-size:14px; font-weight:700; color:#8a6a20;
    background:#fff5df; padding:3px 12px; border-radius:999px;
  }
  .board-b .cnt{ color:#1f5b8a; background:#e8f4ff; }

  .place{
    border:2px dashed #dfe9f5; border-radius:14px;
    padding:8px 10px 10px; background:#fbfdff; margin-top:8px;
  }
  .plabel{ font-size:11.5px; color:#9db0c8; letter-spacing:1px; margin-bottom:6px; }

  .sticks{ display:flex; align-items:flex-end; gap:6px; min-height:62px; }
  .sticks.tens{ flex-wrap:nowrap; }
  .sticks.ones{ flex-wrap:wrap; row-gap:6px; }

  .stick{
    width:7px; height:58px; border-radius:3px; flex:0 0 auto;
    background:linear-gradient(180deg,var(--gold1),var(--gold2));
    box-shadow:inset -1px 0 rgba(0,0,0,.13), 0 1px 2px rgba(160,110,20,.18);
  }
  .bundle{
    position:relative; width:26px; height:58px; border-radius:4px; flex:0 0 auto;
    background:repeating-linear-gradient(to right,var(--gold1) 0 1.4px,var(--gold2) 1.4px 2.6px);
    box-shadow:inset -1px 0 rgba(0,0,0,.12), 0 1px 2px rgba(160,110,20,.18);
  }
  .bundle::after{
    content:''; position:absolute; left:-2px; right:-2px; top:50%; height:9px;
    transform:translateY(-50%); border-radius:5px;
    background:linear-gradient(180deg,#c07945,#8a4f2a);
    box-shadow:0 1px 3px rgba(0,0,0,.25);
  }
  .board-b .stick{ background:linear-gradient(180deg,var(--blue1),var(--blue2)); }
  .board-b .bundle{
    background:repeating-linear-gradient(to right,var(--blue1) 0 1.4px,var(--blue2) 1.4px 2.6px);
  }
  .board-b .bundle::after{ background:linear-gradient(180deg,#5f87b3,#3d5f85); }

  @keyframes bundleBreak{
    0%{ transform:scale(1) rotate(0deg); opacity:1; }
    25%{ transform:scale(1.15) rotate(-5deg); }
    50%{ transform:scale(1.15) rotate(5deg); }
    100%{ transform:scale(.45) rotate(0deg); opacity:0; }
  }
  .bundle.breaking{ animation:bundleBreak .42s ease forwards; }

  @keyframes dropIn{
    0%{ transform:translateY(-34px) scale(.35); opacity:0; }
    62%{ transform:translateY(3px) scale(1.06); opacity:1; }
    100%{ transform:translateY(0) scale(1); opacity:1; }
  }

  @keyframes takeAway{
    0%{ transform:translateY(0) scale(1); opacity:1; }
    35%{ transform:translateY(-9px) scale(1.12); }
    100%{ transform:translateY(2px) scale(.55); opacity:.16; filter:grayscale(1); }
  }
  .stick.removed,.bundle.removed{ animation:takeAway .5s ease forwards; }

  .stage{
    display:flex; flex-wrap:wrap; gap:20px; align-items:center;
    margin-top:20px; background:#fff; border-radius:20px; padding:18px 20px;
    border:1px solid #eaf1f9; box-shadow:0 8px 24px rgba(84,116,160,.10);
  }
  .vertical-wrap{ flex:0 0 auto; transition:opacity .3s; }
  .vertical-wrap.hidden{ opacity:0; pointer-events:none; }
  .vertical{ display:inline-block; font-family:ui-monospace,"SF Mono",Menlo,monospace; }
  .vrow{ display:flex; align-items:center; }
  .op{ width:34px; text-align:center; font-size:28px; color:var(--muted); }
  .num{
    display:inline-block; width:58px; text-align:center; font-size:34px; font-weight:800;
    color:var(--ink); line-height:1.25;
  }
  .num.small{ font-size:26px; }
  .num.changed{ color:var(--accent); }
  .num.ans{ color:#2f9e6d; }
  .num.flash{ animation:flashCol 1.1s ease-in-out 3; border-radius:10px; }
  @keyframes flashCol{
    0%,100%{ background:transparent; }
    50%{ background:#ffe9a8; }
  }
  @keyframes pop{ 0%{ transform:scale(1);} 45%{ transform:scale(1.4);} 100%{ transform:scale(1);} }
  .num.pop{ animation:pop .45s ease; }
  .vbar{ height:3px; background:var(--ink); border-radius:2px; margin:6px 0 6px 34px; width:116px; }

  .hint{
    flex:1 1 260px; font-size:clamp(15px,2.4vw,17px); line-height:1.8;
    color:#3d4a60; background:#f5faff; border-left:5px solid #8fc4f0;
    padding:12px 16px; border-radius:12px; min-height:64px;
  }
  .hint b{ color:#e2653b; }
  .hint .ok{ color:#2f9e6d; font-weight:800; }

  .controls{ display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin-top:24px; }
  .btn{
    font-family:inherit; font-size:16px; font-weight:700; letter-spacing:.5px;
    padding:13px 26px; border-radius:14px; border:2px solid #dbe7f4;
    background:#fff; color:#4a5a75; cursor:pointer;
    box-shadow:0 4px 12px rgba(84,116,160,.10);
    transition:transform .15s, box-shadow .15s, background .2s, border-color .2s;
  }
  .btn:hover:not(:disabled){ transform:translateY(-2px); box-shadow:0 8px 18px rgba(84,116,160,.18); }
  .btn:active:not(:disabled){ transform:translateY(0); }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn.primary{
    background:linear-gradient(135deg,#ffb648,#ff8a3d);
    color:#fff; border-color:transparent;
    box-shadow:0 8px 20px rgba(255,138,61,.38);
  }
  .btn.primary:hover:not(:disabled){ box-shadow:0 12px 26px rgba(255,138,61,.48); }

  @media (max-width:640px){
    .board{ padding:12px; }
    .num{ width:46px; font-size:28px; }
    .num.small{ font-size:21px; }
    .op{ width:28px; font-size:22px; }
    .vbar{ margin-left:28px; width:92px; }
    .stick,.bundle{ height:50px; }
    .sticks{ min-height:54px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>寶可夢 · 退位減法棒棒圖</h1>
    <p class="sub">一捆 = 10 根　·　看看「不夠減」的時候怎麼辦</p>
  </header>

  <section class="qcard">
    <div class="qtag">應用題</div>
    <p id="qtext">載入中…</p>
    <div class="eqline" id="eqline"></div>
  </section>

  <section class="boards">
    <div class="board" id="boardA">
      <div class="board-head">
        <span class="who" id="whoA">甲</span>
        <span class="cnt" id="cntA"></span>
      </div>
      <div class="place">
        <div class="plabel">十位　（每捆 10 根）</div>
        <div class="sticks tens" id="aTens"></div>
      </div>
      <div class="place">
        <div class="plabel">個位　（一根一根）</div>
        <div class="sticks ones" id="aOnes"></div>
      </div>
    </div>

    <div class="board board-b" id="boardB">
      <div class="board-head">
        <span class="who" id="whoB">乙</span>
        <span class="cnt" id="cntB"></span>
      </div>
      <div class="place">
        <div class="plabel">十位　（每捆 10 根）</div>
        <div class="sticks tens" id="bTens"></div>
      </div>
      <div class="place">
        <div class="plabel">個位　（一根一根）</div>
        <div class="sticks ones" id="bOnes"></div>
      </div>
    </div>
  </section>

  <section class="stage">
    <div class="vertical-wrap hidden" id="verticalWrap">
      <div class="vertical" id="vertical"></div>
    </div>
    <div class="hint" id="hint"></div>
  </section>

  <div class="controls">
    <button class="btn primary" id="nextBtn">下一步 ▶</button>
    <button class="btn" id="resetBtn">重來</button>
    <button class="btn" id="newBtn">換一題</button>
  </div>

</div>

<script>
/* ===================== 工具 ===================== */
const el  = id => document.getElementById(id);
const rnd = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
const wait = ms => new Promise(r => setTimeout(r, ms));

/* ===================== 寶可夢主題資料 ===================== */
const ITEMS = [
  {n:'樹果',u:'顆'},{n:'寶可夢糖果',u:'顆'},{n:'精靈球',u:'個'},
  {n:'能量方塊',u:'塊'},{n:'樹果汁',u:'瓶'},{n:'寶可夢餅乾',u:'片'},
  {n:'進化石',u:'顆'},{n:'傷藥',u:'瓶'},{n:'徽章',u:'枚'}
];
const NAMES = [
  '皮卡丘','傑尼龜','妙蛙種子','小火龍','伊布','波波',
  '卡比獸','胖丁','可達鴨','六尾','喵喵','呆呆獸'
];

let P = null;
let step = 0;
let animating = false;

/* ===================== 產生題目 ===================== */
function newProblem(){
  const at = rnd(2,9);
  const bt = rnd(1, at-1);
  const ao = rnd(0,8);
  const bo = rnd(ao+1, 9);
  const a  = at*10 + ao;
  const b  = bt*10 + bo;

  const item = ITEMS[rnd(0, ITEMS.length-1)];
  const i1 = rnd(0, NAMES.length-1);
  let   i2 = rnd(0, NAMES.length-1);
  while (i2 === i1) i2 = rnd(0, NAMES.length-1);

  const n1 = NAMES[i1], n2 = NAMES[i2];
  const more = Math.random() < 0.5;

  const text = more
    ? `${n1}有 ${a} ${item.u}${item.n}，${n2}有 ${b} ${item.u}${item.n}。${n1}比${n2}多多少${item.u}${item.n}？`
    : `${n1}有 ${a} ${item.u}${item.n}，${n2}有 ${b} ${item.u}${item.n}。${n2}比${n1}少多少${item.u}${item.n}？`;

  P = { at, ao, bt, bo, a, b, ans:a-b, n1, n2, item, more, text };
  buildAll();
}

/* ===================== 建立畫面 ===================== */
function makeStick(){
  const d = document.createElement('div');
  d.className = 'stick';
  return d;
}
function makeBundle(){
  const d = document.createElement('div');
  d.className = 'bundle';
  return d;
}
function renderSticks(tensEl, onesEl, t, o){
  tensEl.innerHTML = '';
  onesEl.innerHTML = '';
  for (let i=0;i<t;i++) tensEl.appendChild(makeBundle());
  for (let i=0;i<o;i++) onesEl.appendChild(makeStick());
}

function buildAll(){
  const {at,ao,bt,bo,a,b,n1,n2,item,text} = P;

  el('qtext').textContent = text;
  el('eqline').innerHTML = `${a} − ${b} = <span class="qm">?</span>`;

  el('whoA').textContent = n1;
  el('cntA').textContent = `${a} ${item.u}`;
  el('whoB').textContent = n2;
  el('cntB').textContent = `${b} ${item.u}`;

  renderSticks(el('aTens'), el('aOnes'), at, ao);
  renderSticks(el('bTens'), el('bOnes'), bt, bo);

  el('boardA').classList.remove('highlight');
  el('verticalWrap').classList.add('hidden');
  el('vertical').innerHTML = '';

  el('hint').innerHTML =
    '先看看兩邊的棒棒圖：<b>哪隻寶可夢比較多？</b><br>按「下一步」，我們用小棒把多出來的部分找出來。';

  step = 0;
  animating = false;
  updateControls();
}

function updateControls(){
  const btn = el('nextBtn');
  btn.disabled = animating || step >= 4;
  btn.textContent = step >= 4 ? '完成 ✓' : '下一步 ▶';
  el('resetBtn').disabled = animating;
  el('newBtn').disabled = animating;
}

/* ===================== 豎式 ===================== */
function renderVertical(){
  const {at,ao,bt,bo} = P;
  el('vertical').innerHTML = `
    <div class="vrow">
      <span class="op"></span>
      <span class="num" id="vT1">${at}</span>
      <span class="num" id="vT0">${ao}</span>
    </div>
    <div class="vrow">
      <span class="op">−</span>
      <span class="num">${bt}</span>
      <span class="num">${bo}</span>
    </div>
    <div class="vbar"></div>
    <div class="vrow">
      <span class="op"></span>
      <span class="num ans" id="vR1">?</span>
      <span class="num ans" id="vR0">?</span>
    </div>`;
  el('verticalWrap').classList.remove('hidden');
}

/* ===================== 步驟動畫 ===================== */
async function nextStep(){
  if (animating || step >= 4) return;
  animating = true;
  updateControls();
  step++;

  if (step === 1) await step1();
  else if (step === 2) await step2();
  else if (step === 3) await step3();
  else if (step === 4) await step4();

  animating = false;
  updateControls();
}

async function step1(){
  const {a,b,ao,bo} = P;
  renderVertical();
  el('hint').innerHTML =
    `把題目寫成直式：<b>${a} − ${b}</b><br>` +
    `先看個位：<b>${ao} 減 ${bo} 不夠減</b>！<br>要跟十位借 1 捆來拆開。`;
  el('vT0').classList.add('flash');
  await wait(1100);
}

async function step2(){
  const {at,ao} = P;
  el('hint').innerHTML =
    `從十位借走 <b>1 捆</b>，拆開就變成 <b>10 根</b>單根，<br>個位就夠減了！`;

  const tensBox = el('aTens');
  const onesBox = el('aOnes');
  const bundle  = tensBox.lastElementChild;

  if (bundle){
    bundle.classList.add('breaking');
    await wait(400);
    bundle.remove();
  }

  for (let i=0;i<10;i++){
    const s = makeStick();
    s.style.animation = `dropIn .42s ${i*38}ms both`;
    onesBox.appendChild(s);
  }
  await wait(10*38 + 440);
  [...onesBox.children].forEach(c => { c.style.animation = ''; });

  const t1 = el('vT1');
  t1.textContent = at - 1;
  t1.classList.add('changed','pop');

  const t0 = el('vT0');
  t0.classList.remove('flash');
  t0.textContent = ao + 10;
  t0.classList.add('changed','small','pop');

  el('hint').innerHTML =
    `十位變成 <b>${at-1}</b>，個位變成 <b>${ao+10}</b>。<br>` +
    `現在個位夠減了，可以開始拿走囉。`;
  await wait(700);
}

async function step3(){
  const {bt,bo,b} = P;
  el('hint').innerHTML =
    `要減掉 <b>${b}</b>：<br>先從個位拿走 <b>${bo} 根</b>，再從十位拿走 <b>${bt} 捆</b>。`;

  const onesBox = el('aOnes');
  const onesArr = [...onesBox.children].filter(c => !c.classList.contains('removed'));
  for (let i=0;i<bo;i++){
    const s = onesArr[onesArr.length-1-i];
    if (s) s.classList.add('removed');
    await wait(115);
  }

  const tensBox = el('aTens');
  const tensArr = [...tensBox.children].filter(c => !c.classList.contains('removed'));
  for (let i=0;i<bt;i++){
    const s = tensArr[tensArr.length-1-i];
    if (s) s.classList.add('removed');
    await wait(160);
  }
  await wait(400);
}

async function step4(){
  const {a,b,ans} = P;
  el('boardA').classList.add('highlight');

  const r1 = el('vR1'), r0 = el('vR0');
  r1.textContent = Math.floor(ans/10);
  r0.textContent = ans % 10;
  r1.classList.add('pop');
  r0.classList.add('pop');

  el('eqline').innerHTML = `${a} − ${b} = <span style="color:#2f9e6d">${ans}</span>`;

  el('hint').innerHTML =
    `剩下沒有被拿走的小棒，就是多出來的部分：<br>` +
    `<span class="ok">${a} − ${b} = ${ans}</span><br>` +
    `所以答案就是 <b>${ans}</b> ${P.item.u}${P.item.n}。`;

  await wait(300);
}

/* ===================== 事件 ===================== */
el('nextBtn').addEventListener('click', nextStep);

el('resetBtn').addEventListener('click', () => {
  if (animating) return;
  buildAll();
});

el('newBtn').addEventListener('click', () => {
  if (animating) return;
  newProblem();
});

/* ===================== 啟動 ===================== */
newProblem();
</script>
</body>
</html>
